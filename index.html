<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lingvara</title>
<style>
:root{--bg:#f7f5f2;--card:#fff;--text:#1d1b19;--muted:#5f5a54;--accent:#5a2346;--line:#e6e1da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141312;--card:#1e1c1b;--text:#f1ede8;--muted:#b3aca4;--accent:#f2c76e;--line:#34302d}}
:root[data-theme="dark"]{--bg:#141312;--card:#1e1c1b;--text:#f1ede8;--muted:#b3aca4;--accent:#f2c76e;--line:#34302d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:2.2rem;margin:0}
.sub{color:var(--muted);margin:4px 0 32px}
a.app{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;color:inherit;text-decoration:none}
a.app strong{color:var(--accent);font-size:1.1rem}
a.app span{display:block;color:var(--muted);font-size:.95rem}
footer{color:var(--muted);font-size:.9rem;margin-top:32px}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Lingvara</h1>
<p class="sub">Dil öğrenme uygulamaları</p>
<a class="app" href="haydi-rusca/"><strong>Haydi Rusça</strong><span>Gizlilik politikası</span></a>
<footer>İletişim: <a href="mailto:lingvara.apps@gmail.com">lingvara.apps@gmail.com</a></footer>
</main>
</body>
</html>
